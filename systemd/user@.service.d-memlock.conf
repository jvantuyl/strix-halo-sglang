# Install as /etc/systemd/system/user@.service.d/memlock.conf (root), then
# `systemctl daemon-reload` and `systemctl restart user@<uid>.service`.
# Raises the per-user systemd manager's memlock hard limit (8 MiB by default)
# so user units may set LimitMEMLOCK=infinity themselves (flm.service).
[Service]
LimitMEMLOCK=infinity
