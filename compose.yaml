# docker compose up -d  →  SGLang on http://localhost:30000
#
# One-time setup: create the host cache dirs before the first `up`, or the
# Docker daemon will create them owned by root:
#   mkdir -p ~/.cache/huggingface ~/.cache/strix-halo-sglang-tunableop
# (`start-sglang.sh` does this automatically.)
#
# Override defaults via .env or shell env, e.g.:
#   SGLANG_MODEL=Qwen/Qwen3.5-4B HF_TOKEN=hf_xxx docker compose up -d

services:
  sglang:
    image: ${SGLANG_IMAGE:-strix-halo-sglang:dev}
    container_name: sglang
    restart: unless-stopped
    network_mode: host
    ipc: host
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      SGLANG_FORCE_NATIVE_LAYERNORM: "1"
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${TUNABLE_DIR:-~/.cache/strix-halo-sglang-tunableop}:/root/.tunableop
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - ${SGLANG_MODEL:-Qwen/Qwen3.5-4B}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --mem-fraction-static
      - "${SGLANG_MEM_FRAC:-0.5}"
      - --context-length
      - "${SGLANG_CONTEXT:-8192}"
      - --attention-backend
      - triton
      - --cuda-graph-max-bs-decode
      - "${SGLANG_CUDA_GRAPH_MAX_BS:-8}"

  # Qwen3.8-Flash-Next with the PLE table read from a file (docs/RUNNING_QWEN38.md).
  # Needs the fp8-converted checkpoint (tools/convert_ple_fp8.py) and a 128 GB box.
  # Create the host dirs first so they are not root-owned:
  #   mkdir -p /opt/llm/ple-cache ~/.cache/strix-halo-sglang-cache
  #   docker compose --profile qwen38 up -d qwen38
  # Same flags as start-qwen38.sh; keep the two in sync.
  qwen38:
    profiles: ["qwen38"]
    image: ${SGLANG_IMAGE:-strix-halo-sglang:dev}
    container_name: sglang-qwen38
    restart: unless-stopped
    network_mode: host
    ipc: host
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      SGLANG_FORCE_NATIVE_LAYERNORM: "1"
      SGLANG_USE_AITER: "0"
      SGLANG_QWEN4_PLE_FILE_SKIP_DEVICE_CHECK: "1"
      # Tuning benchmarks every GEMM solution per new prompt length (14-20 s
      # of TTFT each); recorded tunings are still used with it off.
      PYTORCH_TUNABLEOP_TUNING: "${SGLANG_TUNABLEOP_TUNING:-0}"
      # Headroom is thin (~95 of 96 GiB in use); avoid allocator fragmentation.
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"
    volumes:
      - ${QWEN38_MODEL_DIR:-~/models/Qwen3.8-Flash-Next-AWQ-INT4-ple-fp8}:/models/qwen38:ro
      - ${QWEN38_PLE_DIR:-/opt/llm/ple-cache}:/ple
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${TUNABLE_DIR:-~/.cache/strix-halo-sglang-tunableop}:/root/.tunableop
      # Triton / JIT kernel cache, so restarts do not recompile everything.
      - ${SGL_CACHE_DIR:-~/.cache/strix-halo-sglang-cache}:/root/.cache/sglang
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/qwen38
      - --served-model-name
      - qwen38-flash-next
      - --host
      - 0.0.0.0
      - --port
      - "${QWEN38_PORT:-30001}"
      - --ple-offload-embedding
      - --ple-offload-backend
      - file
      - --ple-offload-dir
      - /ple
      - --mem-fraction-static
      - "${QWEN38_MEM_FRAC:-0.85}"
      - --context-length
      - "${QWEN38_CONTEXT:-32768}"
      # fp8 KV halves the pool; the cap turns that into ~3 GB of headroom.
      - --kv-cache-dtype
      - "${QWEN38_KV_DTYPE:-fp8_e4m3}"
      - --max-total-tokens
      - "${QWEN38_MAX_TOTAL_TOKENS:-262144}"
      # QWEN38_MODEL_OVERRIDE='{"language_model_only": true}' drops the vision tower.
      - --json-model-override-args
      - '${QWEN38_MODEL_OVERRIDE:-{}}'
      - --attention-backend
      - triton
      - --cuda-graph-max-bs-decode
      - "${QWEN38_CUDA_GRAPH_MAX_BS:-8}"
      - --mamba-ssm-dtype
      - bfloat16
      - --reasoning-parser
      - qwen3-thinking
      - --tool-call-parser
      - qwen3_coder
