# docker compose up -d  →  SGLang on http://localhost:30000
#
# One-time setup: create the host cache dirs before the first `up`, or the
# Docker daemon will create them owned by root:
#   mkdir -p ~/.cache/huggingface ~/.cache/strix-halo-sglang-tunableop
# (`start-sglang.sh` does this automatically.)
#
# Override defaults via .env or shell env, e.g.:
#   SGLANG_MODEL=Qwen/Qwen3.5-4B HF_TOKEN=hf_xxx docker compose up -d
#
# Tuned fused-MoE tiles are mounted per checkpoint from configs/moe/<profile>
# (patch 17), not baked into the image; MOE_CONFIG_DIR / QWEN38_MOE_CONFIG_DIR
# pick the profile. See configs/moe/README.md.

services:
  sglang:
    image: ${SGLANG_IMAGE:-strix-halo-sglang:dev}
    container_name: sglang
    restart: unless-stopped
    network_mode: host
    ipc: host
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      SGLANG_FORCE_NATIVE_LAYERNORM: "1"
      SGLANG_MOE_CONFIG_DIR: /moe-configs
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${TUNABLE_DIR:-~/.cache/strix-halo-sglang-tunableop}:/root/.tunableop
      - ${MOE_CONFIG_DIR:-./configs/moe/qwen3.5-35b-a3b}:/moe-configs:ro
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - ${SGLANG_MODEL:-Qwen/Qwen3.5-4B}
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --mem-fraction-static
      - "${SGLANG_MEM_FRAC:-0.5}"
      - --context-length
      - "${SGLANG_CONTEXT:-8192}"
      - --attention-backend
      - triton
      - --cuda-graph-max-bs-decode
      - "${SGLANG_CUDA_GRAPH_MAX_BS:-8}"

  # Qwen3.8-Flash-Next with the PLE table read from a file (docs/RUNNING_QWEN38.md).
  # Needs the fp8-converted checkpoint (tools/convert_ple_fp8.py) and a 128 GB box.
  # Create the host dirs first so they are not root-owned:
  #   mkdir -p /opt/llm/ple-cache ~/.cache/strix-halo-sglang-cache
  #   docker compose --profile qwen38 up -d qwen38
  # Same flags as start-qwen38.sh; keep the two in sync.
  qwen38:
    profiles: ["qwen38"]
    image: ${SGLANG_IMAGE:-strix-halo-sglang:dev}
    container_name: sglang-qwen38
    restart: unless-stopped
    network_mode: host
    ipc: host
    security_opt:
      - seccomp:unconfined
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      SGLANG_FORCE_NATIVE_LAYERNORM: "1"
      SGLANG_USE_AITER: "0"
      SGLANG_QWEN4_PLE_FILE_SKIP_DEVICE_CHECK: "1"
      SGLANG_MOE_CONFIG_DIR: /moe-configs
      # Tuning benchmarks every GEMM solution per new prompt length (14-20 s
      # of TTFT each); recorded tunings are still used with it off.
      PYTORCH_TUNABLEOP_TUNING: "${SGLANG_TUNABLEOP_TUNING:-0}"
      # Headroom is thin (~95 of 96 GiB in use); avoid allocator fragmentation.
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"
      # With the presharded dump enabled, set this to the image ID (docker
      # image inspect -f '{{.Id}}') so a rebuilt image gets its own dump.
      SGLANG_PRESHARDED_STAMP: "${SGLANG_PRESHARDED_STAMP:-}"
    volumes:
      - ${QWEN38_MODEL_DIR:-~/models/Qwen3.8-Flash-Next-AWQ-INT4-ple-fp8}:/models/qwen38:ro
      - ${QWEN38_PLE_DIR:-/opt/llm/ple-cache}:/ple
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${TUNABLE_DIR:-~/.cache/strix-halo-sglang-tunableop}:/root/.tunableop
      # Triton / JIT kernel cache, so restarts do not recompile everything.
      - ${SGL_CACHE_DIR:-~/.cache/strix-halo-sglang-cache}:/root/.cache/sglang
      # Tuned MoE tiles for this checkpoint (g32); another checkpoint gets its own profile.
      - ${QWEN38_MOE_CONFIG_DIR:-./configs/moe/qwen38-flash-next}:/moe-configs:ro
      # Stock chat template plus the default_system_prompt kwarg.
      - ${QWEN38_CHAT_TEMPLATE:-./configs/chat/qwen38.jinja}:/chat-template.jinja:ro
      # Post-processed weight dump for fast restarts (--load-format presharded,
      # ~75 GiB on the first boot); point QWEN38_PRESHARDED_DIR at local NVMe
      # and add the two flags below to the command to use it.
      #- ${QWEN38_PRESHARDED_DIR:-/opt/llm/presharded}:/presharded
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/qwen38
      - --served-model-name
      - qwen38-flash-next
      - --host
      - 0.0.0.0
      - --port
      - "${QWEN38_PORT:-30001}"
      - --ple-offload-embedding
      - --ple-offload-backend
      - file
      - --ple-offload-dir
      - /ple
      - --mem-fraction-static
      - "${QWEN38_MEM_FRAC:-0.85}"
      - --context-length
      - "${QWEN38_CONTEXT:-131072}"
      # fp8 KV halves the pool; the cap turns that into ~3 GB of headroom.
      - --kv-cache-dtype
      - "${QWEN38_KV_DTYPE:-fp8_e4m3}"
      - --max-total-tokens
      - "${QWEN38_MAX_TOTAL_TOKENS:-262144}"
      # QWEN38_MODEL_OVERRIDE='{"language_model_only": true}' drops the vision tower.
      - --json-model-override-args
      - '${QWEN38_MODEL_OVERRIDE:-{}}'
      - --attention-backend
      - triton
      - --cuda-graph-max-bs-decode
      - "${QWEN38_CUDA_GRAPH_MAX_BS:-20}"
      - --max-running-requests
      - "${QWEN38_MAX_RUNNING_REQUESTS:-20}"
      # 5 GDN state slots per request (radix cache on); keep at 5 × the above.
      - --max-mamba-cache-size
      - "${QWEN38_MAMBA_CACHE_SIZE:-100}"
      - --mamba-ssm-dtype
      - bfloat16
      # qwen3, not qwen3-thinking: the latter files the whole answer under
      # reasoning_content when a request disables thinking.
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      #- --load-format
      #- presharded
      #- --model-loader-extra-config
      #- '{"presharded_path": "/presharded/target", "draft_presharded_path": "/presharded/draft", "max_file_bytes": 1073741824, "hash_num_threads": 4}'
      - --chat-template
      - /chat-template.jinja
      # Server-wide template defaults; a request's chat_template_kwargs win.
      # The template's own reasoning_effort default is xhigh (see the runbook).
      - --default-chat-template-kwargs
      - '${QWEN38_DEFAULT_CHAT_TEMPLATE_KWARGS:-{"reasoning_effort": "medium", "default_system_prompt": "If you are unsure or do not know something, say so plainly instead of guessing."}}'
